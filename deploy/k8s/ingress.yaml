apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minesweeper
  namespace: minesweeper
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - minesweeper.metalbear.com
      secretName: minesweeper-tls
  rules:
    - host: minesweeper.metalbear.com
      http:
        paths:
          # Server serves both the static UI (/) and the API on the same origin.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minesweeper-server
                port:
                  number: 3001
