# mirrord Preview Environment: create on PR, delete on merge/close.
# Builds the server image, starts a preview pod on the cluster, posts link + header in a PR comment.
# Requires: KUBECONFIG_DATA secret (deployer SA, bound to the mirrord-operator-ci ClusterRole)
# and the mirrord operator installed with previewEnv enabled.
name: Preview Environment (PR)

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, closed]

concurrency:
  group: preview-env-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_KEY: "pr-${{ github.event.pull_request.number }}"
  IMAGE: "ghcr.io/metalbear-co/minesweeper-server:preview-pr-${{ github.event.pull_request.number }}-${{ github.sha }}"

jobs:
  preview-start:
    name: Start preview (build, push, start, comment)
    # Draft PRs don't get previews; marking ready-for-review starts one.
    if: github.event.action != 'closed' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure cluster access
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > kubeconfig
          echo "KUBECONFIG=$PWD/kubeconfig" >> "$GITHUB_ENV"

      - name: Install mirrord
        run: |
          curl -fsSL https://raw.githubusercontent.com/metalbear-co/mirrord/main/scripts/install.sh | bash
          mirrord --version

      - name: Start mirrord preview
        id: preview
        run: |
          set -o pipefail
          mirrord preview start \
            -f deploy/.mirrord/mirrord-preview.json \
            -i "${{ env.IMAGE }}" \
            -k "${{ env.PREVIEW_KEY }}" \
            --force \
            --timeout 600 | tee preview-start.log
          # Share link support (operator >= 3.183.0 with shareIngress configured) prints a
          # "preview URL" line; older operators don't, and the comment falls back to the header.
          share_url=$(grep -o 'preview URL: https://[^ ]*' preview-start.log | head -1 | cut -d' ' -f3 || true)
          echo "share_url=${share_url}" >> "$GITHUB_OUTPUT"

      - name: Post PR comment with preview link and header
        uses: actions/github-script@v7
        with:
          script: |
            const key = `${{ env.PREVIEW_KEY }}`;
            const shareUrl = `${{ steps.preview.outputs.share_url }}`;
            const appUrl = 'https://minesweeper.metalbear.com';
            const access = shareUrl
              ? `Open the preview directly — no extension or headers needed:

            ### 🔗 [${shareUrl}](${shareUrl})`
              : `To send traffic to this preview, set the header \`baggage: mirrord-session=${key}\` on ${appUrl}:
            - via the [mirrord Browser Extension](https://metalbear.com/mirrord/docs/using-mirrord/browser-extension), or
            - \`curl -H "baggage: mirrord-session=${key}" ${appUrl}/health\``;
            const body = `## mirrord Preview Environment

            A preview environment is running for this PR.

            ${access}

            Requests to [${appUrl}](${appUrl}) without the preview header keep hitting the live deployment.

            *Preview is stopped when the PR is merged or closed.*
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.body && c.body.includes('## mirrord Preview Environment'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  preview-stop:
    name: Stop preview on merge/close
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure cluster access
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > kubeconfig
          echo "KUBECONFIG=$PWD/kubeconfig" >> "$GITHUB_ENV"

      - name: Install mirrord
        run: |
          curl -fsSL https://raw.githubusercontent.com/metalbear-co/mirrord/main/scripts/install.sh | bash
          mirrord --version

      - name: Stop mirrord preview
        run: |
          mirrord preview stop -k "${{ env.PREVIEW_KEY }}" || true
